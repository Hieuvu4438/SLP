[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slp"
version = "0.1.0"
description = "SLP research codebase"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
temporal-plan = [
    "torch>=2.2",
    "transformers>=4.45,<6",
    "sentencepiece>=0.2",
    "smplx>=0.1.28",
]
race-sign = [
    "torch>=2.6",
    "transformers>=4.51,<6",
    "sentencepiece>=0.2",
    "smplx>=0.1.28",
    "omegaconf>=2.3",
    "requests>=2.31",
    "huggingface-hub>=0.34,<2",
    "scipy>=1.10",
]

relikflow = [
    "torch>=2.2",
    "transformers>=4.45,<6",
    "sentencepiece>=0.2",
    "smplx>=0.1.28",
    "pyarrow>=12",
    "matplotlib>=3.7",
]

articulatory-hierarchical-flow-matching = [
    "torch>=2.6",
    "transformers>=4.45,<6",
    "sentencepiece>=0.2",
    "smplx>=0.1.28",
    "scipy>=1.10",
    "sacrebleu>=2.3,<3",
]

slp-multirate = [
    "torch>=2.2",
    "transformers>=4.45,<6",
    "sentencepiece>=0.2",
    "lmdb>=1.4",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["slp", "slp.*", "methods", "methods.slp_multirate", "methods.slp_multirate.*", "methods.relikflow", "methods.relikflow.*", "methods.articulatory_hierarchical_flow_matching"]

[tool.setuptools.package-data]
"methods.articulatory_hierarchical_flow_matching" = ["config.yaml", "*.md"]
"methods.relikflow" = ["config.yaml", "assets.lock.json"]
"methods.slp_multirate" = ["configs/*.yaml", "configs/pilots/*.yaml", "configs/variants/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
