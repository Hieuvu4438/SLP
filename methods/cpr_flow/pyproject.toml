[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cprflow"
version = "0.1.0"
description = "CPR-Flow controlled text-to-sign-motion experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "tqdm>=4.65", "safetensors>=0.4", "lmdb>=1.4", "transformers>=4.45,<6", "sentencepiece>=0.2", "huggingface-hub>=0.25", "smplx>=0.1.28"]

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4", "ruff>=0.4"]
eval = ["pandas>=2", "imageio[ffmpeg]>=2.31", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_body_model: needs licensed SMPL-X neutral expression50 asset"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["source_snapshots"]

[tool.setuptools.package-data]
cprflow = ["defaults.yaml"]
